name: Auto-approve Renovate PRs
description: Approve verified Renovate commits with native GitHub automerge enabled.
inputs:
  app-client-id:
    description: Client ID of the dedicated approval GitHub App.
    required: true
  app-private-key:
    description: Private key of the dedicated approval GitHub App.
    required: true
runs:
  using: composite
  steps:
    - name: Create approval App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.repository }}
        permission-pull-requests: write
    - name: Approve Renovate PRs with native automerge enabled
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        APPROVAL_TOKEN: ${{ steps.app-token.outputs.token }}
        APPROVAL_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
      run: python3 "$ACTION_PATH/approve-renovate.py"
