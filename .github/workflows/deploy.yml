name: Deploy Renovate to repo

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository (e.g., StackVista/repo-name)"
        required: true
        type: string
      ecosystems:
        description: "Ecosystem presets (comma-separated: go,docker,node,java)"
        required: true
        default: "go"
        type: string
      base_branch:
        description: "Base branch of the target repo"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout renovate-config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: config
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.inputs.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.inputs.repository }}
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.inputs.base_branch }}
          path: target
          persist-credentials: false

      - name: Generate renovate.json from ecosystems
        env:
          ECOSYSTEMS: ${{ inputs.ecosystems }}
          CONFIG_SHA: ${{ github.sha }}
        run: config/scripts/deploy/generate-renovate-config.sh "${ECOSYSTEMS}" target/renovate.json "${CONFIG_SHA}"

      - name: Prepare target repo (copy workflow, remove dependabot)
        env:
          CONFIG_SHA: ${{ github.sha }}
        run: config/scripts/deploy/setup-target-repo.sh config target "${CONFIG_SHA}"

      - name: Create onboarding PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
        run: config/scripts/deploy/create-onboarding-pr.sh target "${REPOSITORY}" "${BASE_BRANCH}" "${ECOSYSTEMS}"
