name: Renovate

on:
  workflow_call:
    inputs:
      log_level:
        description: "Renovate log level"
        type: string
        default: info
      dry_run:
        description: "Run in dry-run mode (no PRs created)"
        type: boolean
        default: false
      mount_docker_socket:
        description: "Enable Docker for isolated post-upgrade tasks"
        type: boolean
        default: false
      allowed_commands:
        description: >-
          JSON array of regex patterns for postUpgradeTasks commands this repo is
          allowed to run (e.g. '["^bash tools/myscript\\.sh"]'). Defaults to an
          empty list (no post-upgrade commands permitted).
        type: string
        default: "[]"
      package_registry_proxy:
        description: "Optional authenticated Maven proxy URL prefix"
        type: string
        default: ""
      package_registry_proxy_username:
        description: "Existing read-only package proxy username"
        type: string
        default: ""
      docker_registry_1:
        description: "Optional Docker registry host for Renovate authentication slot 1"
        type: string
        default: ""
      docker_registry_1_username:
        description: "Optional Docker registry username for Renovate authentication slot 1"
        type: string
        default: ""
      docker_registry_2:
        description: "Optional Docker registry host for Renovate authentication slot 2"
        type: string
        default: ""
      docker_registry_2_username:
        description: "Optional Docker registry username for Renovate authentication slot 2"
        type: string
        default: ""
      docker_registry_3:
        description: "Optional Docker registry host for Renovate authentication slot 3"
        type: string
        default: ""
      docker_registry_3_username:
        description: "Optional Docker registry username for Renovate authentication slot 3"
        type: string
        default: ""
      docker_registry_4:
        description: "Optional Docker registry host for Renovate authentication slot 4"
        type: string
        default: ""
      docker_registry_4_username:
        description: "Optional Docker registry username for Renovate authentication slot 4"
        type: string
        default: ""
      docker_registry_5:
        description: "Optional Docker registry host for Renovate authentication slot 5"
        type: string
        default: ""
      docker_registry_5_username:
        description: "Optional Docker registry username for Renovate authentication slot 5"
        type: string
        default: ""
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY:
        required: true
      PACKAGE_REGISTRY_PROXY_TOKEN:
        required: false
      DOCKER_REGISTRY_1_USERNAME:
        required: false
      DOCKER_REGISTRY_1_PASSWORD:
        required: false
      DOCKER_REGISTRY_2_USERNAME:
        required: false
      DOCKER_REGISTRY_2_PASSWORD:
        required: false
      DOCKER_REGISTRY_3_USERNAME:
        required: false
      DOCKER_REGISTRY_3_PASSWORD:
        required: false
      DOCKER_REGISTRY_4_USERNAME:
        required: false
      DOCKER_REGISTRY_4_PASSWORD:
        required: false
      DOCKER_REGISTRY_5_USERNAME:
        required: false
      DOCKER_REGISTRY_5_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-${{ github.repository }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-statuses: write
          permission-vulnerability-alerts: read

      - name: Configure registry credentials
        env:
          PACKAGE_REGISTRY_PROXY: ${{ inputs.package_registry_proxy }}
          PACKAGE_REGISTRY_PROXY_USERNAME: ${{ inputs.package_registry_proxy_username }}
          PACKAGE_REGISTRY_PROXY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_PROXY_TOKEN }}
          DOCKER_REGISTRY_1_HOST: ${{ inputs.docker_registry_1 }}
          DOCKER_REGISTRY_1_USERNAME: ${{ secrets.DOCKER_REGISTRY_1_USERNAME || inputs.docker_registry_1_username }}
          DOCKER_REGISTRY_1_PASSWORD: ${{ secrets.DOCKER_REGISTRY_1_PASSWORD }}
          DOCKER_REGISTRY_2_HOST: ${{ inputs.docker_registry_2 }}
          DOCKER_REGISTRY_2_USERNAME: ${{ secrets.DOCKER_REGISTRY_2_USERNAME || inputs.docker_registry_2_username }}
          DOCKER_REGISTRY_2_PASSWORD: ${{ secrets.DOCKER_REGISTRY_2_PASSWORD }}
          DOCKER_REGISTRY_3_HOST: ${{ inputs.docker_registry_3 }}
          DOCKER_REGISTRY_3_USERNAME: ${{ secrets.DOCKER_REGISTRY_3_USERNAME || inputs.docker_registry_3_username }}
          DOCKER_REGISTRY_3_PASSWORD: ${{ secrets.DOCKER_REGISTRY_3_PASSWORD }}
          DOCKER_REGISTRY_4_HOST: ${{ inputs.docker_registry_4 }}
          DOCKER_REGISTRY_4_USERNAME: ${{ secrets.DOCKER_REGISTRY_4_USERNAME || inputs.docker_registry_4_username }}
          DOCKER_REGISTRY_4_PASSWORD: ${{ secrets.DOCKER_REGISTRY_4_PASSWORD }}
          DOCKER_REGISTRY_5_HOST: ${{ inputs.docker_registry_5 }}
          DOCKER_REGISTRY_5_USERNAME: ${{ secrets.DOCKER_REGISTRY_5_USERNAME || inputs.docker_registry_5_username }}
          DOCKER_REGISTRY_5_PASSWORD: ${{ secrets.DOCKER_REGISTRY_5_PASSWORD }}
        run: |
          host_rules="[]"

          add_host_rule() {
            local host="$1"
            local username="$2"
            local password="$3"
            local label="$4"
            local host_type="$5"

            if [[ -z "${host}" && -z "${username}" && -z "${password}" ]]; then
              return
            fi

            if [[ -z "${host}" || -z "${username}" || -z "${password}" ]]; then
              echo "Registry credentials for ${label} require host, username, and password" >&2
              exit 1
            fi

            host_rules=$(jq -c \
              --arg host "${host}" \
              --arg username "${username}" \
              --arg password "${password}" \
              --arg host_type "${host_type}" \
              '. + [{hostType: $host_type, matchHost: $host, username: $username, password: $password}]' \
              <<< "${host_rules}")
          }

          for slot in 1 2 3 4 5; do
            host_var="DOCKER_REGISTRY_${slot}_HOST"
            username_var="DOCKER_REGISTRY_${slot}_USERNAME"
            password_var="DOCKER_REGISTRY_${slot}_PASSWORD"

            add_host_rule "${!host_var}" "${!username_var}" "${!password_var}" "slot ${slot}" "docker"
          done

          for host_type in maven sbt; do
            add_host_rule "${PACKAGE_REGISTRY_PROXY}" "${PACKAGE_REGISTRY_PROXY_USERNAME}" \
              "${PACKAGE_REGISTRY_PROXY_TOKEN}" "package proxy" "${host_type}"
          done

          if [[ "${host_rules}" == "[]" ]]; then
            exit 0
          fi

          {
            echo "RENOVATE_HOST_RULES<<EOF"
            echo "${host_rules}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          mount-docker-socket: ${{ inputs.mount_docker_socket }}
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
