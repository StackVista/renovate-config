name: Renovate

on:
  workflow_call:
    inputs:
      log_level:
        description: "Renovate log level"
        type: string
        default: info
      dry_run:
        description: "Run in dry-run mode (no PRs created)"
        type: boolean
        default: false
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY:
        required: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
