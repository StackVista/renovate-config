name: Validate config

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install renovate for config validation
        run: npm install -g renovate@latest

      - name: Lint JSON syntax
        run: make lint-json

      - name: Validate Renovate presets
        run: make validate-presets

      - name: Run unit tests
        run: make unit-test
