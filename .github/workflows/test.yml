name: Validate config

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install renovate for config validation
        run: npm install -g renovate@latest

      - name: Lint JSON syntax
        run: make lint-json

      - name: Validate Renovate presets
        run: make validate-presets

      - name: Run unit tests
        run: make unit-test
