name: Validate config

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install renovate for config validation
        run: npm install -g renovate@latest

      - name: Lint JSON syntax
        run: make lint-json

      - name: Validate Renovate presets
        run: make validate-presets

      - name: Run unit tests
        run: make unit-test
