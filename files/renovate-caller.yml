name: Renovate

on:
  schedule:
    - cron: "0 5,12 * * *" # twice per day at 05:00 and 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@005e342f15c5481932542b5552b23cdd21e624a9 # v1.0.0
    # Optional: configure repo-specific inputs for Renovate.
    # with:
    #   # Docker registry authentication (up to 5 slots).
    #   docker_registry_1: dp.apps.rancher.io
    #   docker_registry_1_username: rancher-user
    #   # Post-upgrade command allowlist: JSON array of regex patterns.
    #   # Only commands matching a pattern here will be executed.
    #   allowed_commands: >-
    #     ["^bash tools/my-post-upgrade-script\\.sh '.*' '.*' '.*'$"]
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
      # DOCKER_REGISTRY_1_USERNAME: ${{ secrets.APPLICATION_COLLECTION_USERNAME }}
      # DOCKER_REGISTRY_1_PASSWORD: ${{ secrets.APPLICATION_COLLECTION_PASSWORD }}
