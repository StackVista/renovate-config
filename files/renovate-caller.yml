name: Renovate

on:
  schedule:
    - cron: "0 5,12 * * *" # twice per day at 05:00 and 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@main
    # Optional: configure repo-specific Docker registries for Renovate.
    # with:
    #   docker_registry_1: dp.apps.rancher.io
    #   docker_registry_1_username: rancher-user
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
      # DOCKER_REGISTRY_1_USERNAME: ${{ secrets.APPLICATION_COLLECTION_USERNAME }}
      # DOCKER_REGISTRY_1_PASSWORD: ${{ secrets.APPLICATION_COLLECTION_PASSWORD }}
